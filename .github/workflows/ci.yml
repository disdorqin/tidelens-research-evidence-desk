name: STEM2Connect Research Evidence Desk checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tidelens tests
      - run: node --check web/research-ranking.js && node --check web/research.js
      - run: node --test tests/test_ranker.cjs
      - run: python -m json.tool web/research-data.json > /dev/null
